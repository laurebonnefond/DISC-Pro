<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DISC — Dynamiques d equipe</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&display=swap');
  :root{
    --d:#E03E36;--i:#F5B731;--s:#3EAF6E;--c:#2D7DD2;
    --bg:#FAFAFA;--surface:#FFF;--text:#1A1A1A;--muted:#6B7280;--border:#E5E7EB;--radius:14px;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#111114;--surface:#1C1C21;--text:#E8E8EC;--muted:#9CA3AF;--border:#2D2D35;
  }}
  :root[data-theme="dark"]{--bg:#111114;--surface:#1C1C21;--text:#E8E8EC;--muted:#9CA3AF;--border:#2D2D35;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
  .container{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
  h1{font-size:1.6rem;font-weight:700;text-align:center;margin-bottom:4px;}
  .page-sub{text-align:center;color:var(--muted);font-size:0.92rem;margin-bottom:28px;}
  .add-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px;}
  .add-section h2{font-size:1rem;font-weight:700;margin-bottom:14px;}
  .form-grid{display:grid;gap:14px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:0.82rem;font-weight:600;color:var(--muted);}
  .field input{padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-family:inherit;font-size:0.93rem;outline:none;}
  .field input:focus{border-color:var(--c);}
  .color-row{display:flex;gap:14px;flex-wrap:wrap;}
  .color-group{flex:1;min-width:150px;}
  .color-group>label{display:block;font-size:0.82rem;font-weight:600;color:var(--muted);margin-bottom:4px;}
  .color-picks{display:flex;gap:6px;}
  .cp{width:42px;height:42px;border-radius:10px;border:2.5px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;opacity:0.45;color:#fff;transition:all 0.15s;}
  .cp:hover{opacity:0.75;}.cp.active{border-color:var(--text);opacity:1;transform:scale(1.1);}
  .same-note{font-size:0.78rem;color:var(--muted);font-style:italic;margin-top:4px;}
  .add-btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--c);color:#fff;font-family:inherit;font-size:0.93rem;font-weight:600;cursor:pointer;margin-top:4px;}
  .add-btn:disabled{opacity:0.3;cursor:not-allowed;}
  .people-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;}
  .person-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:0.85rem;font-weight:600;color:#fff;position:relative;overflow:hidden;}
  .chip-sec{position:absolute;right:0;top:0;bottom:0;width:28%;opacity:0.5;border-radius:0 20px 20px 0;}
  .chip-txt,.rm{position:relative;z-index:1;}
  .rm{cursor:pointer;opacity:0.7;font-size:1rem;margin-left:4px;}.rm:hover{opacity:1;}
  .hint{text-align:center;color:var(--muted);font-size:0.88rem;padding:12px 0;font-style:italic;}
  .results{display:none;}.results.visible{display:block;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .card h2{font-size:1.05rem;font-weight:700;margin-bottom:12px;}
  .team-bar{display:flex;height:28px;border-radius:8px;overflow:hidden;margin-bottom:10px;}
  .team-bar div{display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;color:#fff;}
  .team-summary{font-size:0.88rem;line-height:1.8;}
  .profiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px;}
  .mini-profile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;border-left:4px solid transparent;}
  .mini-profile h4{font-size:0.92rem;font-weight:700;margin-bottom:2px;}
  .mini-profile .mp-sub{font-size:0.8rem;color:var(--muted);margin-bottom:8px;}
  .mini-profile p{font-size:0.85rem;line-height:1.5;}
  .pair-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .pair-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .pair-badge{padding:4px 10px;border-radius:14px;color:#fff;font-weight:700;font-size:0.82rem;display:inline-flex;align-items:center;gap:3px;}
  .pair-badge .sd{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.6);}
  .pair-arrow{color:var(--muted);}
  .compat-meter{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .compat-dots{display:flex;gap:3px;}
  .cd{width:10px;height:10px;border-radius:50%;background:var(--border);}.cd.fill{background:#16a34a;}
  .compat-label{font-size:0.78rem;font-weight:600;min-width:55px;text-align:right;}
  .pair-body p{font-size:0.87rem;line-height:1.6;}
  .pair-body h3{font-size:0.9rem;font-weight:700;margin:12px 0 4px;}
  .pair-body ul{margin:4px 0 0 18px;font-size:0.85rem;}
  .pair-body ul li{margin-bottom:3px;}
  .nuance-box{background:color-mix(in srgb,var(--c) 6%,transparent);border:1px solid color-mix(in srgb,var(--c) 18%,transparent);border-radius:10px;padding:14px 16px;margin-top:12px;}
  .nuance-box h4{font-size:0.87rem;font-weight:700;margin-bottom:4px;color:var(--c);}
  .nuance-box p{font-size:0.84rem;line-height:1.55;}
  .stress-box{background:color-mix(in srgb,var(--d) 6%,transparent);border:1px solid color-mix(in srgb,var(--d) 18%,transparent);border-radius:10px;padding:14px 16px;margin-top:10px;}
  .stress-box h4{font-size:0.87rem;font-weight:700;margin-bottom:4px;color:var(--d);}
  .stress-box p{font-size:0.84rem;}
  .comm-box{background:color-mix(in srgb,var(--s) 6%,transparent);border:1px solid color-mix(in srgb,var(--s) 18%,transparent);border-radius:10px;padding:14px 16px;margin-top:10px;}
  .comm-box h4{font-size:0.87rem;font-weight:700;margin-bottom:4px;color:#168a50;}
  .comm-box p{font-size:0.84rem;}
  .reco-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:16px;border-left:4px solid var(--s);}
  .reco-card h2{font-size:1.05rem;font-weight:700;margin-bottom:10px;}
  .reco-card ul{margin:6px 0 0 18px;font-size:0.88rem;line-height:1.7;}
  .scores-panel{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0;padding:16px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;}
  .score-item{text-align:center;}
  .score-item .sc-label{font-size:0.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;}
  .score-item .sc-ring{width:72px;height:72px;margin:0 auto 6px;position:relative;}
  .score-item .sc-ring svg{transform:rotate(-90deg);}
  .score-item .sc-ring circle{fill:none;stroke-width:6;}
  .score-item .sc-ring .bg{stroke:var(--border);}
  .score-item .sc-ring .fg{stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
  .score-item .sc-val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.1rem;font-weight:700;}
  .score-item .sc-verdict{font-size:0.78rem;font-weight:600;}
  .export-section{text-align:center;margin-top:28px;}
  .export-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:10px;border:none;background:var(--c);color:#fff;font-family:inherit;font-size:0.95rem;font-weight:600;cursor:pointer;}
  .export-btn:hover{filter:brightness(1.1);}
  .export-status{font-size:0.82rem;color:var(--muted);margin-top:8px;}
</style>
</head>
<body>
<div class="container">
  <h1>DISC — Dynamiques d'equipe</h1>
  <p class="page-sub">Profils composites (dominant + secondaire) - Analyse approfondie</p>
  <div class="add-section">
    <h2>Ajouter une personne</h2>
    <div class="form-grid">
      <div class="field"><label>Prenom</label><input type="text" id="inpName" placeholder="Ex : Laure" maxlength="30"></div>
      <div class="color-row">
        <div class="color-group"><label>Dominante</label><div class="color-picks" id="pickP">
          <div class="cp" data-d="D" style="background:var(--d)" onclick="pick('p','D',this)">D</div>
          <div class="cp" data-d="I" style="background:var(--i)" onclick="pick('p','I',this)">I</div>
          <div class="cp" data-d="S" style="background:var(--s)" onclick="pick('p','S',this)">S</div>
          <div class="cp" data-d="C" style="background:var(--c)" onclick="pick('p','C',this)">C</div>
        </div></div>
        <div class="color-group"><label>Secondaire</label><div class="color-picks" id="pickS">
          <div class="cp" data-d="D" style="background:var(--d)" onclick="pick('s','D',this)">D</div>
          <div class="cp" data-d="I" style="background:var(--i)" onclick="pick('s','I',this)">I</div>
          <div class="cp" data-d="S" style="background:var(--s)" onclick="pick('s','S',this)">S</div>
          <div class="cp" data-d="C" style="background:var(--c)" onclick="pick('s','C',this)">C</div>
        </div><p class="same-note">Peut etre identique (profil tres marque)</p></div>
      </div>
      <button class="add-btn" id="addBtn" onclick="addPerson()" disabled>Ajouter</button>
    </div>
  </div>
  <div class="people-list" id="peopleList"></div>
  <div class="hint" id="hint">Ajoute au moins 2 personnes pour voir les dynamiques.</div>
  <div class="results" id="results">
    <div id="teamOverview"></div>
    <div id="profilesSummary"></div>
    <div id="pairsSection"></div>
    <div id="recoSection"></div>
    <div class="export-section">
      <button class="export-btn" onclick="doExport()">📄 Exporter le rapport Word</button>
      <div class="export-status" id="exportStatus"></div>
    </div>
  </div>
</div>
<script>
var M={
  D:{name:"Dominance",color:"#E03E36",emoji:"\ud83d\udd34",short:"Direct, decisif, oriente resultats",motto:"Je veux des resultats, maintenant.",stress:"Devient autoritaire, impatient, decisions hatives",besoin:"Autonomie, defis, controle",peur:"Perdre le controle",comm_tip:"Sois concis, va droit au but, propose des solutions"},
  I:{name:"Influence",color:"#F5B731",emoji:"\ud83d\udfe1",short:"Enthousiaste, sociable, creatif",motto:"Je veux que ce soit fun et ensemble.",stress:"Se disperse, parle beaucoup, perd en rigueur",besoin:"Reconnaissance, interactions, variete",peur:"Etre ignore ou rejete",comm_tip:"Sois chaleureux, valorise, raconte une histoire"},
  S:{name:"Stabilite",color:"#3EAF6E",emoji:"\ud83d\udfe2",short:"Patient, fiable, a l ecoute",motto:"Je veux de l harmonie et de la confiance.",stress:"Se replie, evite le conflit, accumule en silence",besoin:"Stabilite, cooperation, temps",peur:"Le conflit, l instabilite",comm_tip:"Sois patient, rassurant, donne du temps"},
  C:{name:"Conformite",color:"#2D7DD2",emoji:"\ud83d\udfe5",short:"Methodique, rigoureux, analytique",motto:"Je veux que ce soit bien fait, avec des preuves.",stress:"Devient ultra-critique, perfectionniste, distant",besoin:"Donnees, structure, reflexion",peur:"L erreur, l approximation",comm_tip:"Fournis des preuves, sois structure, respecte les process"}
};
var SC={same:10,adj:5,opp:0};
function calcScores(a,b){var ix=IX[gk(a.p,b.p)];var base_compat=ix.compat;var base_compl=ix.compl;var bonus=0;if(a.s===b.p||b.s===a.p)bonus+=8;if(a.s===b.s)bonus+=4;if(a.p===a.s)bonus-=3;if(b.p===b.s)bonus-=3;if(a.s!==a.p&&b.s!==b.p){var sk=gk(a.s,b.s);var sIx=IX[sk];if(sIx){base_compat=Math.round(base_compat*0.7+sIx.compat*0.3);base_compl=Math.round(base_compl*0.7+sIx.compl*0.3);}}var compat=Math.min(98,Math.max(15,base_compat+bonus));var compl=Math.min(98,Math.max(15,base_compl+bonus));var synergie=Math.round(compat*0.45+compl*0.55);return {compat:compat,compl:compl,synergie:synergie};}
var IX={
  "D-D":{c:3,compat:55,compl:30,l:"Duo de choc ou de chocs",dyn:"Deux D = energie d action intense. Objectif commun = machine de guerre. Divergence = bras de fer.",f:["Decisions ultra-rapides","Forte execution","Zero hesitation"],r:["Lutte de pouvoir","Ecoute insuffisante","Pas de recul"],co:["Definir les zones de responsabilite","Arbitrage par donnees ou tiers","S ecouter AVANT de trancher"],pro:"En reunion : peuvent ecraser les autres. Prevoir un moderateur.",stress_duo:"Escalade : les deux deviennent directifs en meme temps. Besoin d un tiers.",comm_duo:"Parler resultats. Respecter le territoire de l autre."},
  "D-I":{c:4,compat:72,compl:75,l:"Duo visionnaire",dyn:"Le D donne la direction, le I l adhesion. Lancent et vendent des projets avec force.",f:["Lancement dynamique","Entrainent les autres","Action + communication"],r:["Manque de suivi","Decisions trop rapides","Le I peut se sentir ecrase"],co:["S entourer d un S ou C pour le suivi","Valoriser les idees du I","Formaliser par ecrit"],pro:"Duo visible. Peut monopoliser — inclure S et C.",stress_duo:"Le D devient cassant, le I se sent rejete et se disperse.",comm_duo:"Le D ecoute les idees du I avant de trancher. Le I accepte la franchise du D."},
  "D-S":{c:3,compat:45,compl:85,l:"Complementaires sous conditions",dyn:"Le D pousse, le S stabilise. Fonctionne si le D respecte le rythme du S.",f:["Equilibre action / relation","Le S tempere le D","Le D dynamise le S"],r:["Le D peut brusquer","Le S accumule du ressentiment","Rythmes opposes"],co:["Le D demande l avis ET attend","Le S exprime son desaccord tot","Signaux de tempo"],pro:"Le D decide, le S adhere en surface — verifier l alignement.",stress_duo:"Le D accelere + le S se tait = decisions unilaterales. Points de sync reguliers.",comm_duo:"Le D ralentit et pose des questions ouvertes. Le S ose dire non."},
  "D-C":{c:3,compat:40,compl:82,l:"Efficacite vs precision",dyn:"Le D veut vite, le C veut bien. Tension productive quand bien geree.",f:["Resultats de qualite","Le C apporte la rigueur","Le D apporte la vitesse"],r:["Le D trouve le C lent","Le C trouve le D impulsif","Frustration mutuelle"],co:["Convenir du niveau de qualite attendu","Le C priorise ses remarques","Le D reconnait le travail de fond"],pro:"C prepare, D execute. Ne pas inverser.",stress_duo:"Le D impose, le C se braque sur les details. Revenir aux donnees.",comm_duo:"Le D fournit un cadre clair. Le C livre ses analyses par ecrit."},
  "I-I":{c:4,compat:85,compl:28,l:"Festival d idees",dyn:"Energie debordante, idees fusent, ambiance top. Risque : rien ne se concretise.",f:["Brainstorming prolifique","Ambiance motivante","Innovation"],r:["Dispersion totale","Aucun suivi","Chacun parle, personne ne structure"],co:["Plan d action ecrit avec deadlines","Inviter un C ou S","Se challenger sur le suivi"],pro:"Excellent en brainstorm. Risque en execution.",stress_duo:"Les deux parlent en meme temps, clarte baisse. Nommer un facilitateur.",comm_duo:"Se laisser finir ses phrases. Formaliser a l ecrit."},
  "I-S":{c:5,compat:88,compl:78,l:"Alliance naturelle",dyn:"Un des duos les plus fluides. Le I apporte l elan, le S la stabilite.",f:["Communication facile","Le I dynamise, le S ancre","Forte cohesion"],r:["Evitement des sujets difficiles","Manque de confrontation","Decisions pour la paix"],co:["Oser les desaccords","Le I verifie (silence != accord)","Le S exprime ses besoins"],pro:"Ideal pour accompagnement, formation, mediation.",stress_duo:"Le I parle pour rien, le S encaisse. Rituels de feedback honnete.",comm_duo:"Le I verifie la comprehension. Le S dit non plutot que oui mais."},
  "I-C":{c:2,compat:32,compl:85,l:"Tension creative",dyn:"Le duo le plus polarise. Le I = emotion, le C = faits. Puissant ou incomprehension.",f:["Le I humanise le C","Le C structure le I","Vision + rigueur si alignes"],r:["Le I trouve le C froid","Le C trouve le I superficiel","Communication opposee"],co:["Le I prepare avec des donnees","Le C valorise avant de critiquer","Langage commun : schemas, visuels"],pro:"Difficile en binome sans mediateur. Bon en equipe avec un S.",stress_duo:"Le I se sent juge, le C se sent envahi. Terrain neutre = faits + impact humain.",comm_duo:"Le I envoie un resume avant la reunion. Le C commence par le positif."},
  "S-S":{c:4,compat:90,compl:30,l:"Havre de paix",dyn:"Serein, cooperatif, stable. Harmonie naturelle. Risque : immobilisme.",f:["Ambiance ideale","Fiabilite","Ecoute exemplaire"],r:["Evitement du conflit","Difficulte a trancher","Resistance au changement"],co:["Permission de dire non","Deadlines de decision","Desaccord != rupture"],pro:"Solide pour le suivi. Besoin d un D ou I pour l elan.",stress_duo:"Les deux evitent le probleme, il grossit. Point de verite regulier.",comm_duo:"Nommer les non-dits. Question : qu est-ce qu on n ose pas se dire ?"},
  "S-C":{c:4,compat:72,compl:74,l:"Duo fiabilite",dyn:"Le S apporte l humain, le C la methode. Qualite, fiabilite, solidite.",f:["Haute qualite","Processus bien huiles","Ambiance calme et pro"],r:["Lenteur","Manque d audace","Opportunites ratees"],co:["Criteres de declenchement clairs","Le S aide le C en chaleur","Le C aide le S a objectiver"],pro:"Ideal pour qualite, audit. Moins pour innovation rapide.",stress_duo:"Le S se tait, le C se noie dans les details. Question : prochaine action concrete ?",comm_duo:"Le C traduit en recommandations. Le S partage son ressenti."},
  "C-C":{c:3,compat:75,compl:25,l:"Laboratoire de precision",dyn:"Rigueur exceptionnelle. Perfectionnisme combine = potentiellement paralysant.",f:["Excellence technique","Analyse approfondie","Detection des erreurs"],r:["Paralysie par l analyse","Perfectionnisme sans frein","Manque d elan"],co:["Definir le good enough","Alterner analyse et livraison","S entourer d un I ou D"],pro:"Parfait pour R&D, data, audit.",stress_duo:"Surenchere de perfectionnisme. Regle : 80% = on livre et on itere.",comm_duo:"Se challenger sur assez bien. Planifier les revues."}
};
var secNuances={D:"apporte un cote combatif et oriente action",I:"apporte un cote chaleureux et communicatif",S:"apporte un cote stabilisateur et empathique",C:"apporte un cote analytique et exigeant"};
var secTips={"D-D":"Deux sec. D amplifient la competition.","D-I":"Sec. D accelere, sec. I communique. Bon equilibre.","D-S":"Tension : D-sec. fonce, S-sec. securise.","D-C":"D-sec. tranche, C-sec. verifie. Cycle accelerer-freiner.","I-I":"Double sec. I = beaucoup de parole. Time-keeper necessaire.","I-S":"I-sec. ouvre, S-sec. ecoute. Harmonie.","I-C":"I-sec. partage, C-sec. analyse seul. Respecter les temps.","S-S":"Double sec. S = resistance au changement.","S-C":"S-sec. harmonie + C-sec. perfection = soigne mais lent.","C-C":"Double sec. C = exigence max. Criteres d arret obligatoires."};
var sameColor={D:"Profil D tres marque : leadership ultra-affirme, force brute de decision, risque d autoritarisme amplifie.",I:"Profil I tres marque : charisme et energie max. Magnetique, mais dispersion decuplee.",S:"Profil S tres marque : ancrage et fiabilite exceptionnels. Pilier humain, mais difficulte a s affirmer.",C:"Profil C tres marque : rigueur et exigence au sommet. Qualite rare, perfectionnisme potentiellement bloquant."};
function gk(a,b){return [a,b].sort().join("-");}

var people=[],selP=null,selS=null;
document.getElementById("inpName").addEventListener("input",ck);
document.getElementById("inpName").addEventListener("keydown",function(e){if(e.key==="Enter")addPerson();});
function pick(w,d,el){var ctn=w==="p"?"pickP":"pickS";document.querySelectorAll("#"+ctn+" .cp").forEach(function(c){c.classList.remove("active");});el.classList.add("active");if(w==="p")selP=d;else selS=d;ck();}
function ck(){document.getElementById("addBtn").disabled=!(document.getElementById("inpName").value.trim()&&selP&&selS);}
function addPerson(){var name=document.getElementById("inpName").value.trim();if(!name||!selP||!selS||people.length>=8)return;people.push({name:name,p:selP,s:selS});document.getElementById("inpName").value="";selP=selS=null;document.querySelectorAll(".cp").forEach(function(c){c.classList.remove("active");});ck();renderPeople();if(people.length>=2)renderResults();document.getElementById("inpName").focus();}
function removePerson(i){people.splice(i,1);renderPeople();if(people.length>=2)renderResults();else document.getElementById("results").classList.remove("visible");}
function renderPeople(){document.getElementById("peopleList").innerHTML=people.map(function(p,i){return '<span class="person-chip" style="background:'+M[p.p].color+'"><span class="chip-sec" style="background:'+M[p.s].color+'"></span><span class="chip-txt">'+M[p.p].emoji+" "+p.name+" ("+p.p+"/"+p.s+')</span><span class="rm" onclick="removePerson('+i+')">&#10005;</span></span>';}).join("");document.getElementById("hint").style.display=people.length>=2?"none":"block";}

function renderResults(){document.getElementById("results").classList.add("visible");renderTeam();renderProfiles();renderPairs();renderReco();}

function renderTeam(){var ct={D:0,I:0,S:0,C:0};people.forEach(function(p){ct[p.p]++;ct[p.s]+=0.5;});var tot=ct.D+ct.I+ct.S+ct.C;function pct(k){return Math.round(ct[k]/tot*100);}var bar="";["D","I","S","C"].forEach(function(k){if(ct[k]>0)bar+='<div style="width:'+pct(k)+"%;background:"+M[k].color+'">'+pct(k)+"%</div>";});var primC={D:0,I:0,S:0,C:0};people.forEach(function(p){primC[p.p]++;});var missing=["D","I","S","C"].filter(function(k){return primC[k]===0;});var over=["D","I","S","C"].filter(function(k){return primC[k]>=Math.ceil(people.length*0.5);});var compSec=missing.filter(function(k){return people.some(function(p){return p.s===k;});});var diag="";if(missing.length)diag+="<br>&#9888;&#65039; <strong>Absent en dominant :</strong> "+missing.map(function(k){return M[k].emoji+" "+M[k].name;}).join(", ");if(compSec.length)diag+="<br>&#128260; <strong>Compense en secondaire :</strong> "+compSec.map(function(k){return M[k].emoji+" "+M[k].name;}).join(", ");if(over.length)diag+="<br>&#128202; <strong>Surrepresente :</strong> "+over.map(function(k){return M[k].emoji+" "+M[k].name;}).join(", ");if(!missing.length&&!over.length)diag+="<br>&#9989; <strong>Equipe equilibree</strong>";document.getElementById("teamOverview").innerHTML='<div class="card"><h2>Vue d ensemble ('+people.length+' personnes)</h2><div class="team-bar">'+bar+'</div><p style="font-size:0.8rem;color:var(--muted);margin-bottom:8px;">Ponderation : dominante = 1, secondaire = 0.5</p><div class="team-summary">'+people.map(function(p){return M[p.p].emoji+" <strong>"+p.name+"</strong> : "+M[p.p].name+(p.p===p.s?" (tres marque)":"-"+M[p.s].name);}).join(" &middot; ")+diag+"</div></div>";}

function renderProfiles(){var html='<h2 style="font-size:1.05rem;font-weight:700;margin-bottom:12px;">Fiches individuelles</h2><div class="profiles-grid">';people.forEach(function(p){var pm=M[p.p],sm=M[p.s],same=p.p===p.s;html+='<div class="mini-profile" style="border-left-color:'+pm.color+'"><h4>'+pm.emoji+" "+p.name+'</h4><div class="mp-sub">'+pm.name+(same?" (tres marque)":' / '+sm.name)+"</div>"+(same?"<p><em>"+sameColor[p.p]+"</em></p>":"")+"<p><strong>Motto :</strong> "+pm.motto+"</p><p><strong>Besoin :</strong> "+pm.besoin+"</p><p><strong>Peur :</strong> "+pm.peur+"</p><p><strong>Sous stress :</strong> "+pm.stress+"</p>"+(!same?"<p><strong>Nuance "+sm.emoji+" :</strong> "+secNuances[p.s]+"</p>":"")+"<p><strong>Communication :</strong> "+pm.comm_tip+"</p></div>";});html+="</div>";document.getElementById("profilesSummary").innerHTML=html;}

function ringSvg(pct,color){var r=30,circ=2*Math.PI*r,off=circ*(1-pct/100);return '<svg width="72" height="72" viewBox="0 0 72 72"><circle class="bg" cx="36" cy="36" r="'+r+'"/><circle class="fg" cx="36" cy="36" r="'+r+'" stroke="'+color+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/></svg>';}
function verdict(v){if(v>=80)return{t:"Excellent",c:"#16a34a"};if(v>=65)return{t:"Bon",c:"#2D7DD2"};if(v>=50)return{t:"Correct",c:"#d97706"};if(v>=35)return{t:"Tendu",c:"#ea580c"};return{t:"Difficile",c:"#dc2626"};}
function renderPairs(){var html='<h2 style="font-size:1.05rem;font-weight:700;margin:20px 0 14px;">Interactions par binome</h2>';for(var i=0;i<people.length;i++){for(var j=i+1;j<people.length;j++){var a=people[i],b=people[j],key=gk(a.p,b.p),ix=IX[key],sk=gk(a.s,b.s);var sc=calcScores(a,b);var vCompat=verdict(sc.compat),vCompl=verdict(sc.compl),vSyn=verdict(sc.synergie);html+='<div class="pair-card"><div class="pair-header"><span class="pair-badge" style="background:'+M[a.p].color+'">'+M[a.p].emoji+" "+a.name+' <span class="sd" style="background:'+M[a.s].color+'"></span></span><span class="pair-arrow">&#10231;</span><span class="pair-badge" style="background:'+M[b.p].color+'">'+M[b.p].emoji+" "+b.name+' <span class="sd" style="background:'+M[b.s].color+'"></span></span></div><div class="scores-panel"><div class="score-item"><div class="sc-label">Compatibilite</div><div class="sc-ring">'+ringSvg(sc.compat,vCompat.c)+'<div class="sc-val" style="color:'+vCompat.c+'">'+sc.compat+'%</div></div><div class="sc-verdict" style="color:'+vCompat.c+'">'+vCompat.t+'</div></div><div class="score-item"><div class="sc-label">Complementarite</div><div class="sc-ring">'+ringSvg(sc.compl,vCompl.c)+'<div class="sc-val" style="color:'+vCompl.c+'">'+sc.compl+'%</div></div><div class="sc-verdict" style="color:'+vCompl.c+'">'+vCompl.t+'</div></div><div class="score-item"><div class="sc-label">Synergie</div><div class="sc-ring">'+ringSvg(sc.synergie,vSyn.c)+'<div class="sc-val" style="color:'+vSyn.c+'">'+sc.synergie+'%</div></div><div class="sc-verdict" style="color:'+vSyn.c+'">'+vSyn.t+'</div></div></div><div class="pair-body"><p><strong>'+ix.l+"</strong> <span style='font-size:0.82rem;color:var(--muted);'>("+M[a.p].name+" / "+M[b.p].name+")</span></p><p>"+ix.dyn+"</p><h3>&#9989; Forces</h3><ul>"+ix.f.map(function(f){return "<li>"+f+"</li>";}).join("")+"</ul><h3>&#9888;&#65039; Risques</h3><ul>"+ix.r.map(function(r){return "<li>"+r+"</li>";}).join("")+"</ul><h3>&#128161; Conseils</h3><ul>"+ix.co.map(function(c){return "<li>"+c+"</li>";}).join("")+"</ul><p style='margin-top:6px;font-size:0.84rem;color:var(--muted);'>"+ix.pro+"</p>"+'<div class="stress-box"><h4>&#128293; Sous stress ensemble</h4><p>'+ix.stress_duo+"</p></div>"+'<div class="comm-box"><h4>&#128172; Cles de communication</h4><p>'+ix.comm_duo+"</p></div>"+'<div class="nuance-box"><h4>&#127912; Nuance des secondaires</h4><p><strong>'+a.name+"</strong> (sec. "+M[a.s].emoji+" "+M[a.s].name+") : "+secNuances[a.s]+".</p><p><strong>"+b.name+"</strong> (sec. "+M[b.s].emoji+" "+M[b.s].name+") : "+secNuances[b.s]+".</p>"+(secTips[sk]?"<p style='margin-top:6px;font-weight:600;'>&#8594; "+secTips[sk]+"</p>":"")+"</div></div></div>";}}document.getElementById("pairsSection").innerHTML=html;}

function renderReco(){var primC={D:0,I:0,S:0,C:0};people.forEach(function(p){primC[p.p]++;});var missing=["D","I","S","C"].filter(function(k){return primC[k]===0;});var tips=[];if(missing.indexOf("D")>=0)tips.push("Manque de <strong>Dominance</strong> — nommer un decideur de secours pour l urgence.");if(missing.indexOf("I")>=0)tips.push("Manque d <strong>Influence</strong> — prevoir des moments de partage informel.");if(missing.indexOf("S")>=0)tips.push("Manque de <strong>Stabilite</strong> — ritualiser les points individuels.");if(missing.indexOf("C")>=0)tips.push("Manque de <strong>Conformite</strong> — mettre en place des checklists.");if(!tips.length)tips.push("Bonne diversite ! Adapter sa communication au profil de chaque interlocuteur.");tips.push("<strong>Regle d or DISC :</strong> communique dans SON style. D = concret, I = energie, S = securite, C = preuves.");document.getElementById("recoSection").innerHTML='<div class="reco-card"><h2>&#127919; Recommandations</h2><ul>'+tips.map(function(t){return "<li>"+t+"</li>";}).join("")+"</ul></div>";}

function doExport(){
  document.getElementById("exportStatus").textContent="Generation...";
  var now=new Date();
  var ds=now.getDate()+"/"+(now.getMonth()+1)+"/"+now.getFullYear();
  var doc='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><style>@page{size:A4;margin:2cm 2.5cm;}body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#1a1a1a;line-height:1.6;}h1{font-size:20pt;color:#2D7DD2;border-bottom:3px solid #2D7DD2;padding-bottom:6px;}h2{font-size:14pt;margin-top:20px;border-bottom:1px solid #ddd;padding-bottom:4px;}table{border-collapse:collapse;width:100%;margin:10px 0;}td,th{border:1px solid #ccc;padding:7px 12px;font-size:10.5pt;}th{background:#f0f4f8;font-weight:700;text-align:left;}ul{margin:4px 0 4px 20px;}li{margin-bottom:2px;}</style></head><body>';
  doc+="<h1>Rapport de dynamiques DISC</h1>";
  doc+="<p><strong>Date :</strong> "+ds+" | <strong>Participants :</strong> "+people.map(function(p){return p.name+" ("+M[p.p].name+"/"+ M[p.s].name+")";}).join(", ")+"</p>";
  doc+="<h2>1. Composition</h2><table><tr><th>Nom</th><th>Dominante</th><th>Secondaire</th></tr>";
  people.forEach(function(p){doc+="<tr><td>"+p.name+"</td><td style='color:"+M[p.p].color+";font-weight:700'>"+M[p.p].name+"</td><td style='color:"+M[p.s].color+";font-weight:700'>"+M[p.s].name+"</td></tr>";});
  doc+="</table><h2>2. Fiches individuelles</h2>";
  people.forEach(function(p){var pm=M[p.p],sm=M[p.s],same=p.p===p.s;doc+="<div style='border:1px solid #ddd;border-left:4px solid "+pm.color+";padding:12px 16px;margin:8px 0;'><p style='font-weight:bold;font-size:12pt;'>"+p.name+" - "+pm.name+(same?" (tres marque)":"/"+sm.name)+"</p>"+(same?"<p><em>"+sameColor[p.p]+"</em></p>":"")+"<p><strong>Motto :</strong> "+pm.motto+"</p><p><strong>Besoin :</strong> "+pm.besoin+" | <strong>Peur :</strong> "+pm.peur+"</p><p><strong>Sous stress :</strong> "+pm.stress+"</p>"+(!same?"<p><strong>Nuance sec. :</strong> "+secNuances[p.s]+"</p>":"")+"<p><strong>Communication :</strong> "+pm.comm_tip+"</p></div>";});
  doc+="<h2>3. Interactions</h2>";
  for(var i=0;i<people.length;i++){for(var j=i+1;j<people.length;j++){var a=people[i],b=people[j],key=gk(a.p,b.p),ix=IX[key],sk=gk(a.s,b.s);var sc=calcScores(a,b);doc+="<div style='border:1px solid #ddd;border-left:4px solid "+M[a.p].color+";padding:14px 16px;margin:10px 0;page-break-inside:avoid;'><p style='font-size:12pt;font-weight:bold;'>"+a.name+" ("+M[a.p].name+"/"+M[a.s].name+") - "+b.name+" ("+M[b.p].name+"/"+M[b.s].name+")</p><table style='width:100%;margin:8px 0;'><tr><th style='background:#f8f8f8;'>Compatibilite</th><th style='background:#f8f8f8;'>Complementarite</th><th style='background:#f8f8f8;'>Synergie</th></tr><tr><td style='text-align:center;font-weight:bold;font-size:14pt;'>"+sc.compat+"%</td><td style='text-align:center;font-weight:bold;font-size:14pt;'>"+sc.compl+"%</td><td style='text-align:center;font-weight:bold;font-size:14pt;color:#2D7DD2;'>"+sc.synergie+"%</td></tr></table><p><strong>"+ix.l+"</strong></p><p>"+ix.dyn+"</p><p style='font-weight:bold;margin-top:8px;'>Forces :</p><ul>"+ix.f.map(function(f){return "<li>"+f+"</li>";}).join("")+"</ul><p style='font-weight:bold;'>Risques :</p><ul>"+ix.r.map(function(r){return "<li>"+r+"</li>";}).join("")+"</ul><p style='font-weight:bold;'>Conseils :</p><ul>"+ix.co.map(function(c){return "<li>"+c+"</li>";}).join("")+"</ul><div style='background:#fff0f0;padding:8px 12px;margin-top:8px;'><p style='font-weight:bold;color:#c0392b;'>Sous stress :</p><p>"+ix.stress_duo+"</p></div><div style='background:#f0fff4;padding:8px 12px;margin-top:6px;'><p style='font-weight:bold;color:#168a50;'>Communication :</p><p>"+ix.comm_duo+"</p></div><div style='background:#f0f7ff;padding:8px 12px;margin-top:6px;'><p style='font-weight:bold;color:#2D7DD2;'>Secondaires :</p><p>"+a.name+" (sec. "+M[a.s].name+") : "+secNuances[a.s]+".</p><p>"+b.name+" (sec. "+M[b.s].name+") : "+secNuances[b.s]+".</p>"+(secTips[sk]?"<p style='font-weight:bold;'>"+secTips[sk]+"</p>":"")+"</div></div>";}}
  doc+="<h2>4. Grille de communication</h2><table><tr><th>Profil</th><th>Ce qu il attend</th><th>A eviter</th></tr><tr><td style='color:#E03E36;font-weight:700'>D</td><td>Concision, solutions</td><td>Tourner autour du pot</td></tr><tr><td style='color:#F5B731;font-weight:700'>I</td><td>Enthousiasme, valorisation</td><td>Froideur</td></tr><tr><td style='color:#3EAF6E;font-weight:700'>S</td><td>Patience, reassurance</td><td>Brusquer</td></tr><tr><td style='color:#2D7DD2;font-weight:700'>C</td><td>Preuves, structure</td><td>Flou, pression</td></tr></table>";
  doc+="<h2>5. Sources</h2><p style='font-size:9.5pt;color:#555;'>Marston W.M. (1928) Emotions of Normal People. Geier J.G. (1979) Personal Profile System. Scullard & Baum (2015) Everything DiSC Manual, Wiley. Sugerman et al. (2011) The 8 Dimensions of Leadership. Bonnstetter & Suiter (2013) The Universal Language DISC, TTI. Rohm R.A. (2013) Positive Personality Profiles.</p><p style='font-size:9pt;color:#999;margin-top:16px;text-align:center;border-top:1px solid #eee;padding-top:8px;'>Outil pedagogique — ne remplace pas un profil DISC certifie</p>";
  doc+="</body></html>";

  var filename="Dynamiques_DISC_"+now.getFullYear()+"-"+(now.getMonth()+1)+"-"+now.getDate()+".doc";
  var blob=new Blob(["\ufeff"+doc],{type:"application/msword"});
  var link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download=filename;
  link.style.display="none";
  document.body.appendChild(link);
  link.click();
  setTimeout(function(){document.body.removeChild(link);},1000);
  document.getElementById("exportStatus").textContent="Telecharge !";
  setTimeout(function(){document.getElementById("exportStatus").textContent="";},3000);
}
</script>
</body>
</html>
